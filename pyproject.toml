[project]
name = "data_quality_pydantic_project"
version = "0.1.0"
description = "A project for ensuring data quality using Pydantic"
authors = [
    {name = "Frederico Carvalho",email = "64483575+hallyfred@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "mermaid (>=0.3.2,<0.4.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-mermaid2-plugin (>=1.2.3,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "duckdb (>=1.5.6,<2.0.0)",
    "pandera[io] (>=0.34.1,<0.35.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "black (>=26.10.0,<27.0.0)",
    "datetime (>=6.0,<7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
test = "pytest -v"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
ci = "pytest && mkdocs build --strict"